replicaCount: 1

image:
  name: eg-gateway
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9050

env:
  configMapName: common-config
  keys:
    ESSAY_GENIUS_URL: ESSAY_GENIUS_URL
    LOKI_URL: LOKI_URL
    IDENTITY_SERVICE_URL: IDENTITY_SERVICE_URL
    ESSAY_SERVICE_URL: ESSAY_SERVICE_URL
    INTERACTION_SERVICE_URL: INTERACTION_SERVICE_URL

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: api.essay-genius.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
