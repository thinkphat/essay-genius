apiVersion: v1
kind: Service
metadata:
  name: {{ include "eg-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "eg-gateway.labels" . | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "eg-gateway.name" . }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}

