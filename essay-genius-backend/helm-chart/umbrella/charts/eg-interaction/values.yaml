replicaCount: 1

image:
  registry: ""
  name: eg-interaction-service
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    http: 10003
    grpc: 9084

envFrom:
  grpcConfig: grpc-config
  mongoSecret: eg-mongodb-admin-secrets
  identitySecret: eg-identity-secrets

env:
  commonConfig: common-config
  identitySecret: eg-identity-secrets
  mongoConfig: eg-interaction-mongodb-config

