apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eg-frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "eg-frontend.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "eg-frontend.name" . }}
    spec:
      containers:
        - name: eg-frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}

